<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gantt — Kitsu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.3/dist/frappe-gantt.min.css" />
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg, #0f1115);
      color: var(--fg, #e5e7eb);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }
    .toolbar h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .toolbar .group {
      display: inline-flex;
      gap: 6px;
    }
    .toolbar button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: inherit;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar button.active,
    .toolbar button:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .toolbar .spacer { flex: 1; }
    .toolbar .status { font-size: 12px; opacity: 0.6; }
    #gantt-container {
      width: 100%;
      overflow: auto;
      padding: 8px 0;
    }
    #empty {
      padding: 32px;
      text-align: center;
      opacity: 0.6;
      font-size: 13px;
    }
    /* Override frappe-gantt for dark mode */
    .gantt .grid-header { fill: #1a1d24; }
    .gantt .grid-row { fill: #11141a; }
    .gantt .grid-row:nth-child(even) { fill: #0f1115; }
    .gantt .row-line { stroke: #232733; }
    .gantt .tick { stroke: #232733; }
    .gantt .today-highlight { fill: #f59e0b; opacity: 0.15; }
    .gantt .bar-progress { fill: rgba(255, 255, 255, 0.25); }
    .gantt text { fill: #e5e7eb !important; }
    .gantt .arrow { stroke: #94a3b8; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Gantt</h1>
    <div class="group" id="view-mode">
      <button data-mode="Quarter Day">Q</button>
      <button data-mode="Half Day">½</button>
      <button data-mode="Day" class="active">Day</button>
      <button data-mode="Week">Week</button>
      <button data-mode="Month">Month</button>
    </div>
    <div class="group">
      <button id="source-tasks" class="active">Tasks</button>
      <button id="source-schedule">Schedule items</button>
    </div>
    <div class="spacer"></div>
    <div class="status" id="status">Loading…</div>
  </div>
  <svg id="gantt-container"></svg>
  <div id="empty" hidden>No dated tasks in this project yet. Add <code>start_date</code> and <code>due_date</code> on tasks to see them here.</div>

  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.3/dist/frappe-gantt.umd.js"></script>
  <script>
    // Minimal MVP: read project_id from query string, fetch tasks from Zou plugin API, render Gantt.
    const params = new URLSearchParams(location.search);
    const projectId = params.get("project_id");
    const status = document.getElementById("status");
    const empty = document.getElementById("empty");
    const container = document.getElementById("gantt-container");

    let gantt = null;
    let currentMode = "Day";
    let currentSource = "tasks";

    if (!projectId) {
      status.textContent = "Missing project_id";
      empty.hidden = false;
      empty.textContent = "Open this page from the Kitsu project sidebar (the plugin link adds the project_id query param).";
    } else {
      load();
    }

    document.querySelectorAll("#view-mode button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#view-mode button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        if (gantt) gantt.change_view_mode(currentMode);
      });
    });

    document.getElementById("source-tasks").addEventListener("click", () => switchSource("tasks"));
    document.getElementById("source-schedule").addEventListener("click", () => switchSource("schedule"));

    function switchSource(s) {
      currentSource = s;
      document.getElementById("source-tasks").classList.toggle("active", s === "tasks");
      document.getElementById("source-schedule").classList.toggle("active", s === "schedule");
      load();
    }

    async function load() {
      status.textContent = "Loading…";
      empty.hidden = true;
      const endpoint = currentSource === "tasks" ? "tasks" : "schedule-items";
      try {
        const res = await fetch(`/api/plugins/gantt/${endpoint}?project_id=${projectId}`, {
          credentials: "include",
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        renderGantt(rows);
        status.textContent = `${rows.length} item${rows.length === 1 ? "" : "s"}`;
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        empty.hidden = false;
        empty.textContent = `Failed to load: ${e.message}`;
      }
    }

    function renderGantt(rows) {
      const tasks = rows
        .filter((r) => r.start && r.end)
        .map((r) => ({
          id: r.id,
          name: r.name || r.task_type_name || "(unnamed)",
          start: r.start.slice(0, 10),
          end: r.end.slice(0, 10),
          progress: r.progress ?? 0,
          custom_class: `status-${(r.task_status_short_name || "").toLowerCase().replace(/[^a-z0-9]/g, "")}`,
        }));

      // Inject one CSS rule per distinct task_status_color so bars are coloured.
      const seen = new Set();
      rows.forEach((r) => {
        const cls = `status-${(r.task_status_short_name || "").toLowerCase().replace(/[^a-z0-9]/g, "")}`;
        if (seen.has(cls)) return;
        seen.add(cls);
        const color = r.task_status_color || "#64748b";
        const style = document.createElement("style");
        style.textContent = `.gantt .bar-wrapper.${cls} .bar { fill: ${color}; }`;
        document.head.appendChild(style);
      });

      container.innerHTML = "";
      if (!tasks.length) {
        empty.hidden = false;
        gantt = null;
        return;
      }
      gantt = new Gantt(container, tasks, {
        view_mode: currentMode,
        date_format: "YYYY-MM-DD",
        bar_height: 22,
        bar_corner_radius: 4,
        padding: 16,
      });
    }
  </script>
</body>
</html>

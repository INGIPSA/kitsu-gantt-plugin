<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gantt — Kitsu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.3/dist/frappe-gantt.min.css" />
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg, #0f1115);
      color: var(--fg, #e5e7eb);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }
    .toolbar h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .toolbar .group {
      display: inline-flex;
      gap: 6px;
    }
    .toolbar button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: inherit;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar button.active,
    .toolbar button:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .toolbar .spacer { flex: 1; }
    .toolbar .status { font-size: 12px; opacity: 0.6; }
    .chart-wrap {
      display: flex;
      width: 100%;
      height: calc(100vh - 60px);
      overflow: hidden;
    }
    .name-col {
      flex: 0 0 220px;
      overflow-y: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      background: #0f1115;
    }
    .name-col-header {
      height: 60px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: flex-end;
    }
    .name-col-list {
      overflow-y: auto;
      max-height: calc(100vh - 120px);
    }
    .name-col-row {
      height: 38px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .name-col-row.milestone { color: #fca5a5; font-weight: 600; }
    .chart-col { flex: 1; overflow: auto; }
    #gantt-container { padding: 0; }
    #empty {
      padding: 32px;
      text-align: center;
      opacity: 0.6;
      font-size: 13px;
    }
    /* Override frappe-gantt for dark mode — graph paper / krateczki look */
    /* Frappe-gantt 1.0.3 renders the header as an HTML <div>, not SVG */
    .gantt-container, .gantt-container .grid-header {
      background-color: #11141a !important;
      color: #e5e7eb;
    }
    .gantt-container .upper-header, .gantt-container .lower-header {
      color: #e5e7eb;
      background-color: transparent !important;
    }
    .gantt-container .upper-text, .gantt-container .lower-text {
      color: rgba(229, 231, 235, 0.75) !important;
    }
    .gantt-container .current-upper, .gantt-container .current-ball-highlight {
      background-color: #f59e0b !important;
      color: #11141a !important;
    }
    /* SVG body — flat rows, subtle ticks */
    .gantt .grid-header,
    .gantt .grid-row,
    .gantt .grid-row:nth-child(even) { fill: #11141a; }
    .gantt .tick { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .gantt .tick.thick { stroke: rgba(255, 255, 255, 0.1); }
    .gantt .row-line { stroke: rgba(255, 255, 255, 0.04); }
    .gantt .holiday-highlight { fill: rgba(255, 255, 255, 0.025) !important; }
    .gantt .today-highlight { fill: #f59e0b; opacity: 0.18; }
    .gantt .bar-progress { fill: rgba(255, 255, 255, 0.22); }
    .gantt text { fill: #e5e7eb; }
    .gantt .lower-text, .gantt .upper-text { opacity: 0.75; }
    .gantt .arrow { stroke: #94a3b8; }
    /* Per-bar label colour is set inline based on bg luma — see js below */
    /* Milestone overlay (vertical red line across the chart) */
    .milestone-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ef4444;
      pointer-events: none;
      z-index: 5;
    }
    .milestone-overlay::before {
      content: "🚩 " attr(data-name);
      position: absolute;
      top: 4px;
      left: 6px;
      white-space: nowrap;
      background: rgba(239, 68, 68, 0.95);
      color: #fef2f2;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      pointer-events: auto;
    }
    .chart-col { position: relative; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Gantt</h1>
    <div class="group" id="view-mode">
      <button data-mode="Quarter Day">Q</button>
      <button data-mode="Half Day">½</button>
      <button data-mode="Day" class="active">Day</button>
      <button data-mode="Week">Week</button>
      <button data-mode="Month">Month</button>
    </div>
    <div class="group">
      <button id="source-tasks" class="active">Tasks</button>
      <button id="source-schedule">Schedule items</button>
    </div>
    <div class="group">
      <button id="toggle-milestones" class="active" title="Show / hide milestones">🚩 Milestones</button>
    </div>
    <div class="spacer"></div>
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="chart-wrap">
    <div class="name-col">
      <div class="name-col-header">Task</div>
      <div class="name-col-list" id="name-list"></div>
    </div>
    <div class="chart-col" id="chart-col">
      <svg id="gantt-container"></svg>
      <div id="empty" hidden>No dated tasks in this project yet. Add <code>start_date</code> and <code>due_date</code> on tasks to see them here.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.3/dist/frappe-gantt.umd.js"></script>
  <script>
    // Minimal MVP: read project_id from query string, fetch tasks from Zou plugin API, render Gantt.
    // Kitsu embeds the plugin in a same-origin iframe under /api/plugins/gantt/frontend/
    // and the project_id only lives in the parent URL — try both.
    function readProjectId() {
      // Kitsu plugin convention (since 1.0.x): production_id is passed as a query
      // param into the iframe. We also accept project_id for direct deep-links,
      // and fall back to the parent URL pattern /productions/<uuid>/...
      const own = new URLSearchParams(location.search);
      const fromOwn = own.get("production_id") || own.get("project_id");
      if (fromOwn) return fromOwn;
      try {
        const p = window.parent.location;
        const parentQ = new URLSearchParams(p.search);
        const fromParent = parentQ.get("production_id") || parentQ.get("project_id");
        if (fromParent) return fromParent;
        const m = p.pathname.match(/\/productions\/([0-9a-f-]{36})/i);
        if (m) return m[1];
      } catch (_) {
        // Cross-origin (shouldn't happen for same-origin Kitsu plugin; ignore)
      }
      return null;
    }
    const projectId = readProjectId();
    const status = document.getElementById("status");
    const empty = document.getElementById("empty");
    // `container` is the SVG mount node. It gets re-created on every render so
    // always read it via the helper rather than caching the initial reference.
    function getContainer() { return document.getElementById("gantt-container"); }

    let gantt = null;
    let currentMode = "Day";
    let currentSource = "tasks";
    let showMilestones = true;
    let currentMilestones = [];

    if (!projectId) {
      status.textContent = "Missing project_id";
      empty.hidden = false;
      empty.textContent = "Open this page from the Kitsu project sidebar (the plugin link adds the project_id query param).";
    } else {
      load();
    }

    document.querySelectorAll("#view-mode button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#view-mode button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        // Reload so column_width and view_mode_padding take effect (change_view_mode keeps the old layout).
        load();
      });
    });

    document.getElementById("source-tasks").addEventListener("click", () => switchSource("tasks"));
    document.getElementById("source-schedule").addEventListener("click", () => switchSource("schedule"));
    document.getElementById("toggle-milestones").addEventListener("click", () => {
      showMilestones = !showMilestones;
      document.getElementById("toggle-milestones").classList.toggle("active", showMilestones);
      load();
    });

    function switchSource(s) {
      currentSource = s;
      document.getElementById("source-tasks").classList.toggle("active", s === "tasks");
      document.getElementById("source-schedule").classList.toggle("active", s === "schedule");
      load();
    }

    async function load() {
      status.textContent = "Loading…";
      empty.hidden = true;
      const endpoint = currentSource === "tasks" ? "tasks" : "schedule-items";
      try {
        const [rows, milestones] = await Promise.all([
          fetch(`/api/plugins/gantt/${endpoint}?project_id=${projectId}`, { credentials: "include" })
            .then((r) => { if (!r.ok) throw new Error(`tasks HTTP ${r.status}`); return r.json(); }),
          showMilestones
            ? fetch(`/api/plugins/gantt/milestones?project_id=${projectId}`, { credentials: "include" })
                .then((r) => (r.ok ? r.json() : []))
                .catch(() => [])
            : Promise.resolve([]),
        ]);
        currentMilestones = milestones;
        renderGantt(rows, milestones);
        const ms = milestones.length;
        status.textContent = `${rows.length} item${rows.length === 1 ? "" : "s"}` + (ms ? `  ·  ${ms} milestone${ms === 1 ? "" : "s"}` : "");
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        empty.hidden = false;
        empty.textContent = `Failed to load: ${e.message}`;
      }
    }

    // Compute relative luminance (WCAG) for an arbitrary hex / rgb color so
    // we can pick a readable label colour on bars whose status colour is
    // close to either extreme (TATO has Todo = #f5f5f5 which is near-white).
    function lumaFromHex(hex) {
      if (!hex) return 1;
      let m = hex.match(/^#?([0-9a-f]{6})$/i);
      if (!m) {
        const rgb = hex.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
        if (!rgb) return 1;
        const [r, g, b] = [+rgb[1], +rgb[2], +rgb[3]];
        return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      }
      const h = m[1];
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    }

    function renderGantt(rows, milestones = []) {
      // Milestones are rendered as OVERLAY vertical lines (see addMilestoneOverlays
      // below), NOT as bars in the rows. Cleaner and matches the today marker.
      const tasks = rows
        .filter((r) => r.start && r.end)
        .map((r) => ({
          id: r.id,
          name: r.name || r.task_type_name || "(unnamed)",
          start: r.start.slice(0, 10),
          end: r.end.slice(0, 10),
          progress: r.progress ?? 0,
          custom_class: `status-${(r.task_status_short_name || "").toLowerCase().replace(/[^a-z0-9]/g, "")}`,
          _color: r.task_status_color,
        }));
      const combined = tasks;

      // Inject one CSS rule per distinct task_status_color so bars are coloured.
      const seen = new Set();
      rows.forEach((r) => {
        const cls = `status-${(r.task_status_short_name || "").toLowerCase().replace(/[^a-z0-9]/g, "")}`;
        if (seen.has(cls)) return;
        seen.add(cls);
        const color = r.task_status_color || "#64748b";
        const style = document.createElement("style");
        style.textContent = `.gantt .bar-wrapper.${cls} .bar { fill: ${color}; }`;
        document.head.appendChild(style);
      });

      // Frappe-gantt 1.0.3 *appends* a fresh .gantt-container DIV (with its own
      // header) every time `new Gantt()` is called — it doesn't clear the
      // previous one. Wipe everything inside chart-col before re-mounting.
      const chartColEl = document.getElementById("chart-col");
      chartColEl.querySelectorAll(".gantt-container, .milestone-overlay").forEach((el) => el.remove());
      // Re-create the SVG mount node (frappe-gantt mutates it heavily, easier to
      // start from a clean one each time)
      const oldSvg = document.getElementById("gantt-container");
      if (oldSvg) oldSvg.remove();
      const freshSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      freshSvg.setAttribute("id", "gantt-container");
      chartColEl.appendChild(freshSvg);
      const mountSvg = freshSvg;
      // Render side-panel rows in the same order frappe-gantt will draw them.
      const nameList = document.getElementById("name-list");
      nameList.innerHTML = "";
      combined.forEach((t) => {
        const row = document.createElement("div");
        row.className = "name-col-row" + (t.custom_class === "milestone" ? " milestone" : "");
        row.textContent = t.name;
        row.title = t.name;
        nameList.appendChild(row);
      });

      if (!combined.length) {
        empty.hidden = false;
        gantt = null;
        return;
      }
      gantt = new Gantt(mountSvg, combined, {
        view_mode: currentMode,
        date_format: "YYYY-MM-DD",
        bar_height: 22,
        bar_corner_radius: 4,
        padding: 16,
        column_width: currentMode === "Month" ? 80 : currentMode === "Week" ? 56 : currentMode === "Day" ? 32 : 24,
        view_mode_padding: { "Quarter Day": "1d", "Half Day": "1d", "Day": "1d", "Week": "3d", "Month": "1w" },
        infinite_padding: false,
        readonly: true,
      });
      // Sync the name-col scroll with the chart's vertical scroll.
      const chartCol = document.getElementById("chart-col");
      chartCol.scrollLeft = 0;
      chartCol.addEventListener(
        "scroll",
        () => {
          nameList.scrollTop = chartCol.scrollTop;
        },
        { passive: true }
      );

      // After frappe-gantt mounts, walk bars in DOM order to:
      //  - flip the label colour to dark when the bar fill is light
      //  - collect calibration samples for empirical pixels-per-day
      const calibSamples = [];
      requestAnimationFrame(() => {
        const wrappers = Array.from(mountSvg.querySelectorAll(".bar-wrapper"));
        wrappers.forEach((wrap, idx) => {
          const row = rows[idx];
          if (!row) return;
          const luma = lumaFromHex(row.task_status_color);
          const labelDark = luma > 0.6;
          wrap.querySelectorAll(".bar-label").forEach((el) => {
            el.style.fill = labelDark ? "#111418" : "#ffffff";
            el.style.fontWeight = "600";
          });
          if (labelDark) {
            wrap.querySelectorAll(".bar-progress").forEach((el) => {
              el.style.fill = "rgba(0, 0, 0, 0.18)";
            });
          }
          if (row.start) {
            const bar = wrap.querySelector(".bar");
            if (bar) {
              calibSamples.push({
                date: new Date(row.start.slice(0, 10) + "T00:00:00"),
                x: parseFloat(bar.getAttribute("x")),
              });
            }
          }
        });

        // Vertical milestone overlays — span full chart height, like today marker.
        // X-position is derived from a calibration pair of (date, x) pulled from
        // any rendered bar in the SVG; this avoids guessing frappe-gantt's
        // internal scale (which changed shape between versions).
        chartCol.querySelectorAll(".milestone-overlay").forEach((el) => el.remove());
        if (showMilestones && currentMilestones.length && calibSamples.length >= 2) {
          // Empirical day-width: pick the two samples with the largest date span,
          // gives the most accurate pixels-per-day independent of view mode.
          const sorted = [...calibSamples].sort((a, b) => a.date - b.date);
          const first = sorted[0];
          const last = sorted[sorted.length - 1];
          const daysSpan = (last.date - first.date) / 86400000;
          if (daysSpan <= 0) return;
          const dayWidth = (last.x - first.x) / daysSpan;
          // Position overlay in chart-col coordinates: chart-col is the scrolling parent,
          // so we want left = SVG x position relative to chart-col content (not viewport).
          // mountSvg sits at offset 0 inside chart-col, so SVG-local x equals chart-col local x.
          currentMilestones.forEach((m) => {
            if (!m.date) return;
            const md = new Date(m.date + "T00:00:00");
            const diffDays = (md - first.date) / 86400000;
            const x = first.x + diffDays * dayWidth;
            const overlay = document.createElement("div");
            overlay.className = "milestone-overlay";
            overlay.style.left = x + "px";
            overlay.setAttribute("data-name", m.name);
            chartCol.appendChild(overlay);
          });
        }
      });
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gantt — Kitsu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.3/dist/frappe-gantt.min.css" />
  <style>
    :root {
      color-scheme: light dark;
      /* Dark theme variables (default) — graph-paper feel */
      --bg:                #0f1115;
      --bg-row:            #11141a;
      --bg-header:         #14171d;
      --fg:                #e5e7eb;
      --fg-dim:            rgba(229, 231, 235, 0.6);
      --border:            rgba(255, 255, 255, 0.12);
      --grid-line:         rgba(255, 255, 255, 0.08);
      --tick-line:         rgba(255, 255, 255, 0.10);
      --tick-thick:        rgba(255, 255, 255, 0.20);
      --weekend-tint:      rgba(255, 255, 255, 0.04);
      --today-fill:        #f59e0b;
      --milestone-fill:    #ef4444;
      --milestone-text:    #fef2f2;
      --progress-fill:     rgba(255, 255, 255, 0.22);
      --btn-bg:            rgba(255, 255, 255, 0.06);
      --btn-bg-hover:      rgba(255, 255, 255, 0.12);
      --btn-border:        rgba(255, 255, 255, 0.08);
    }
    body.theme-light {
      --bg:                #fafbfc;
      --bg-row:            #ffffff;
      --bg-header:         #f1f3f7;
      --fg:                #1f2937;
      --fg-dim:            rgba(31, 41, 55, 0.55);
      --border:            rgba(15, 23, 42, 0.15);
      --grid-line:         rgba(15, 23, 42, 0.10);
      --tick-line:         rgba(15, 23, 42, 0.12);
      --tick-thick:        rgba(15, 23, 42, 0.22);
      --weekend-tint:      rgba(15, 23, 42, 0.05);
      --today-fill:        #f59e0b;
      --milestone-fill:    #ef4444;
      --milestone-text:    #ffffff;
      --progress-fill:     rgba(0, 0, 0, 0.18);
      --btn-bg:            rgba(15, 23, 42, 0.05);
      --btn-bg-hover:      rgba(15, 23, 42, 0.10);
      --btn-border:        rgba(15, 23, 42, 0.10);
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .toolbar h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .toolbar .group {
      display: inline-flex;
      gap: 6px;
    }
    .toolbar button {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: inherit;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar button.active,
    .toolbar button:hover {
      background: var(--btn-bg-hover);
    }
    .toolbar .spacer { flex: 1; }
    .toolbar .status { font-size: 12px; color: var(--fg-dim); }
    html, body { height: 100%; overflow: hidden; }
    .chart-wrap {
      display: flex;
      width: 100%;
      height: calc(100% - 51px); /* toolbar = 51px */
      overflow: hidden;
    }
    .name-col {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg);
      overflow: hidden;
    }
    .name-col-header {
      height: 60px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-dim);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      flex: 0 0 60px;
      box-sizing: border-box;
    }
    .name-col-list {
      flex: 1;
      overflow: hidden; /* synced from chart-col, no own scrollbar */
    }
    .name-col-row {
      height: 38px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      font-size: 12px;
      border-bottom: 1px solid var(--grid-line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
    .chart-col {
      flex: 1;
      overflow: auto;
      position: relative;
      scroll-behavior: smooth;
    }
    /* Thinner scrollbars (WebKit) */
    .chart-col::-webkit-scrollbar { width: 10px; height: 10px; }
    .chart-col::-webkit-scrollbar-track { background: transparent; }
    .chart-col::-webkit-scrollbar-thumb {
      background: var(--btn-bg-hover);
      border-radius: 6px;
      border: 2px solid var(--bg);
    }
    .chart-col::-webkit-scrollbar-thumb:hover { background: var(--btn-border); }
    /* Firefox */
    .chart-col { scrollbar-width: thin; scrollbar-color: var(--btn-bg-hover) transparent; }
    #gantt-container { padding: 0; display: block; }
    #empty {
      padding: 32px;
      text-align: center;
      opacity: 0.6;
      font-size: 13px;
    }
    /* Override frappe-gantt — frappe-gantt 1.0.3 renders the header as an HTML <div>, not SVG */
    /* CRITICAL: frappe-gantt wraps its SVG in a <div class="gantt-container"> with
       overflow:auto and a fixed height — which gives the chart its OWN scrollbars,
       independent of ours. Force it to be a transparent passthrough so our
       chart-col is the single source of truth for scroll. */
    .gantt-container {
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
      width: auto !important;
    }
    .gantt-container, .gantt-container .grid-header {
      background-color: var(--bg-header) !important;
      color: var(--fg);
    }
    .gantt-container .upper-header, .gantt-container .lower-header {
      color: var(--fg);
      background-color: transparent !important;
    }
    .gantt-container .upper-text, .gantt-container .lower-text {
      color: var(--fg-dim) !important;
    }
    .gantt-container .current-upper, .gantt-container .current-ball-highlight {
      background-color: var(--today-fill) !important;
      color: var(--bg) !important;
    }
    /* SVG body */
    .gantt .grid-header,
    .gantt .grid-row,
    .gantt .grid-row:nth-child(even) { fill: var(--bg-row); }
    .gantt .tick { stroke: var(--tick-line); stroke-width: 1; }
    .gantt .tick.thick { stroke: var(--tick-thick); }
    .gantt .row-line { stroke: var(--grid-line); }
    .gantt .holiday-highlight { fill: var(--weekend-tint) !important; }
    .gantt .today-highlight { fill: var(--today-fill); opacity: 0.18; }
    .gantt .bar-progress { fill: var(--progress-fill); }
    .gantt text { fill: var(--fg); }
    .gantt .lower-text, .gantt .upper-text { opacity: 0.75; }
    .gantt .arrow { stroke: var(--fg-dim); }
    /* Milestone line drawn inside the SVG so it scrolls with the chart and
       spans the full chart height naturally. */
    .gantt-milestone-line { stroke: var(--milestone-fill); stroke-width: 2; }
    .gantt-milestone-label {
      fill: var(--milestone-text);
      font-size: 11px;
      font-weight: 600;
    }
    .gantt-milestone-label-bg { fill: var(--milestone-fill); }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Gantt</h1>
    <div class="group" id="view-mode">
      <button data-mode="Quarter Day">Q</button>
      <button data-mode="Half Day">½</button>
      <button data-mode="Day" class="active">Day</button>
      <button data-mode="Week">Week</button>
      <button data-mode="Month">Month</button>
    </div>
    <div class="group">
      <button id="source-tasks" class="active">Tasks</button>
      <button id="source-schedule">Schedule items</button>
    </div>
    <div class="group">
      <button id="toggle-milestones" class="active" title="Show / hide milestones">🚩 Milestones</button>
    </div>
    <div class="spacer"></div>
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="chart-wrap">
    <div class="name-col">
      <div class="name-col-header">Task</div>
      <div class="name-col-list" id="name-list"></div>
    </div>
    <div class="chart-col" id="chart-col">
      <svg id="gantt-container"></svg>
      <div id="empty" hidden>No dated tasks in this project yet. Add <code>start_date</code> and <code>due_date</code> on tasks to see them here.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.3/dist/frappe-gantt.umd.js"></script>
  <script>
    // Minimal MVP: read project_id from query string, fetch tasks from Zou plugin API, render Gantt.
    // Kitsu embeds the plugin in a same-origin iframe under /api/plugins/gantt/frontend/
    // and the project_id only lives in the parent URL — try both.
    function readProjectId() {
      // Kitsu plugin convention (since 1.0.x): production_id is passed as a query
      // param into the iframe. We also accept project_id for direct deep-links,
      // and fall back to the parent URL pattern /productions/<uuid>/...
      const own = new URLSearchParams(location.search);
      const fromOwn = own.get("production_id") || own.get("project_id");
      if (fromOwn) return fromOwn;
      try {
        const p = window.parent.location;
        const parentQ = new URLSearchParams(p.search);
        const fromParent = parentQ.get("production_id") || parentQ.get("project_id");
        if (fromParent) return fromParent;
        const m = p.pathname.match(/\/productions\/([0-9a-f-]{36})/i);
        if (m) return m[1];
      } catch (_) {
        // Cross-origin (shouldn't happen for same-origin Kitsu plugin; ignore)
      }
      return null;
    }
    // Theme — honour Kitsu's `?dark_theme=true|false` iframe param.
    // Falls back to parent <body> class or system preference.
    function applyTheme() {
      const own = new URLSearchParams(location.search).get("dark_theme");
      let dark;
      if (own !== null) {
        dark = own !== "false" && own !== "0";
      } else {
        try {
          const parentDark =
            window.parent.document.body.classList.contains("dark-theme") ||
            window.parent.document.documentElement.classList.contains("dark") ||
            getComputedStyle(window.parent.document.body).backgroundColor.match(/rgb\((\d+),/)?.[1] < 100;
          dark = !!parentDark;
        } catch (_) {
          dark = matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        }
      }
      document.body.classList.toggle("theme-light", !dark);
    }
    applyTheme();

    const projectId = readProjectId();
    const status = document.getElementById("status");
    const empty = document.getElementById("empty");
    // `container` is the SVG mount node. It gets re-created on every render so
    // always read it via the helper rather than caching the initial reference.
    function getContainer() { return document.getElementById("gantt-container"); }

    let gantt = null;
    let currentMode = "Day";
    let currentSource = "tasks";
    let showMilestones = true;
    let currentMilestones = [];

    if (!projectId) {
      status.textContent = "Missing project_id";
      empty.hidden = false;
      empty.textContent = "Open this page from the Kitsu project sidebar (the plugin link adds the project_id query param).";
    } else {
      load();
    }

    document.querySelectorAll("#view-mode button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#view-mode button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        // Reload so column_width and view_mode_padding take effect (change_view_mode keeps the old layout).
        load();
      });
    });

    document.getElementById("source-tasks").addEventListener("click", () => switchSource("tasks"));
    document.getElementById("source-schedule").addEventListener("click", () => switchSource("schedule"));
    document.getElementById("toggle-milestones").addEventListener("click", () => {
      showMilestones = !showMilestones;
      document.getElementById("toggle-milestones").classList.toggle("active", showMilestones);
      load();
    });

    function switchSource(s) {
      currentSource = s;
      document.getElementById("source-tasks").classList.toggle("active", s === "tasks");
      document.getElementById("source-schedule").classList.toggle("active", s === "schedule");
      load();
    }

    async function load() {
      status.textContent = "Loading…";
      empty.hidden = true;
      const endpoint = currentSource === "tasks" ? "tasks" : "schedule-items";
      try {
        const [rows, milestones] = await Promise.all([
          fetch(`/api/plugins/gantt/${endpoint}?project_id=${projectId}`, { credentials: "include" })
            .then((r) => { if (!r.ok) throw new Error(`tasks HTTP ${r.status}`); return r.json(); }),
          showMilestones
            ? fetch(`/api/plugins/gantt/milestones?project_id=${projectId}`, { credentials: "include" })
                .then((r) => (r.ok ? r.json() : []))
                .catch(() => [])
            : Promise.resolve([]),
        ]);
        currentMilestones = milestones;
        renderGantt(rows, milestones);
        const ms = milestones.length;
        status.textContent = `${rows.length} item${rows.length === 1 ? "" : "s"}` + (ms ? `  ·  ${ms} milestone${ms === 1 ? "" : "s"}` : "");
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        empty.hidden = false;
        empty.textContent = `Failed to load: ${e.message}`;
      }
    }

    // Compute relative luminance (WCAG) for an arbitrary hex / rgb color so
    // we can pick a readable label colour on bars whose status colour is
    // close to either extreme (TATO has Todo = #f5f5f5 which is near-white).
    function lumaFromHex(hex) {
      if (!hex) return 1;
      let m = hex.match(/^#?([0-9a-f]{6})$/i);
      if (!m) {
        const rgb = hex.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
        if (!rgb) return 1;
        const [r, g, b] = [+rgb[1], +rgb[2], +rgb[3]];
        return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      }
      const h = m[1];
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    }

    function renderGantt(rows, milestones = []) {
      // Milestones are rendered as OVERLAY vertical lines (see addMilestoneOverlays
      // below), NOT as bars in the rows. Cleaner and matches the today marker.
      const tasks = rows
        .filter((r) => r.start && r.end)
        .map((r) => ({
          id: r.id,
          name: r.name || r.task_type_name || "(unnamed)",
          start: r.start.slice(0, 10),
          end: r.end.slice(0, 10),
          progress: r.progress ?? 0,
          custom_class: `status-${(r.task_status_short_name || "").toLowerCase().replace(/[^a-z0-9]/g, "")}`,
          _color: r.task_status_color,
        }));
      const combined = tasks;

      // Inject one CSS rule per distinct task_status_color so bars are coloured.
      const seen = new Set();
      rows.forEach((r) => {
        const cls = `status-${(r.task_status_short_name || "").toLowerCase().replace(/[^a-z0-9]/g, "")}`;
        if (seen.has(cls)) return;
        seen.add(cls);
        const color = r.task_status_color || "#64748b";
        const style = document.createElement("style");
        style.textContent = `.gantt .bar-wrapper.${cls} .bar { fill: ${color}; }`;
        document.head.appendChild(style);
      });

      // Frappe-gantt 1.0.3 *appends* a fresh .gantt-container DIV (with its own
      // header) every time `new Gantt()` is called — it doesn't clear the
      // previous one. Wipe everything inside chart-col before re-mounting.
      const chartColEl = document.getElementById("chart-col");
      chartColEl.querySelectorAll(".gantt-container, .milestone-overlay").forEach((el) => el.remove());
      // Re-create the SVG mount node (frappe-gantt mutates it heavily, easier to
      // start from a clean one each time)
      const oldSvg = document.getElementById("gantt-container");
      if (oldSvg) oldSvg.remove();
      const freshSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      freshSvg.setAttribute("id", "gantt-container");
      chartColEl.appendChild(freshSvg);
      const mountSvg = freshSvg;
      // Render side-panel rows in the same order frappe-gantt will draw them.
      const nameList = document.getElementById("name-list");
      nameList.innerHTML = "";
      combined.forEach((t) => {
        const row = document.createElement("div");
        row.className = "name-col-row" + (t.custom_class === "milestone" ? " milestone" : "");
        row.textContent = t.name;
        row.title = t.name;
        nameList.appendChild(row);
      });

      if (!combined.length) {
        empty.hidden = false;
        gantt = null;
        return;
      }
      gantt = new Gantt(mountSvg, combined, {
        view_mode: currentMode,
        date_format: "YYYY-MM-DD",
        bar_height: 22,
        bar_corner_radius: 4,
        padding: 16,
        column_width: currentMode === "Month" ? 80 : currentMode === "Week" ? 56 : currentMode === "Day" ? 32 : 24,
        view_mode_padding: { "Quarter Day": "1d", "Half Day": "1d", "Day": "1d", "Week": "3d", "Month": "1w" },
        infinite_padding: false,
        readonly: true,
      });
      // Sync the name-col scroll with the chart's vertical scroll.
      const chartCol = document.getElementById("chart-col");
      chartCol.scrollLeft = 0;
      chartCol.addEventListener(
        "scroll",
        () => {
          nameList.scrollTop = chartCol.scrollTop;
        },
        { passive: true }
      );

      // After frappe-gantt mounts:
      //  - convert SVG width="100%" -> explicit pixel width so chart-col can
      //    actually scroll horizontally instead of cramming everything in
      //  - flip the label colour to dark when the bar fill is light
      //  - collect calibration samples for empirical pixels-per-day
      const calibSamples = [];
      requestAnimationFrame(() => {
        // Force explicit SVG width based on rendered content
        const bars = mountSvg.querySelectorAll(".bar-wrapper .bar");
        let maxRight = 0;
        bars.forEach((b) => {
          const x = parseFloat(b.getAttribute("x") || 0);
          const w = parseFloat(b.getAttribute("width") || 0);
          if (x + w > maxRight) maxRight = x + w;
        });
        if (maxRight > 0) {
          const explicit = Math.max(maxRight + 80, 800);
          mountSvg.setAttribute("width", explicit);
          mountSvg.style.width = explicit + "px";
          mountSvg.style.minWidth = explicit + "px";
        }
        const wrappers = Array.from(mountSvg.querySelectorAll(".bar-wrapper"));
        wrappers.forEach((wrap, idx) => {
          const row = rows[idx];
          if (!row) return;
          const luma = lumaFromHex(row.task_status_color);
          const labelDark = luma > 0.6;
          wrap.querySelectorAll(".bar-label").forEach((el) => {
            el.style.fill = labelDark ? "#111418" : "#ffffff";
            el.style.fontWeight = "600";
          });
          if (labelDark) {
            wrap.querySelectorAll(".bar-progress").forEach((el) => {
              el.style.fill = "rgba(0, 0, 0, 0.18)";
            });
          }
          if (row.start) {
            const bar = wrap.querySelector(".bar");
            if (bar) {
              calibSamples.push({
                date: new Date(row.start.slice(0, 10) + "T00:00:00"),
                x: parseFloat(bar.getAttribute("x")),
              });
            }
          }
        });

        // Vertical milestone overlays — span full chart height, like today marker.
        // X-position is derived from a calibration pair of (date, x) pulled from
        // any rendered bar in the SVG; this avoids guessing frappe-gantt's
        // internal scale (which changed shape between versions).
        // Milestones drawn as SVG inside the chart so they
        //   (a) span the full chart height automatically,
        //   (b) scroll horizontally + vertically with the bars,
        //   (c) inherit any future SVG export.
        mountSvg.querySelectorAll(".gantt-milestone-group").forEach((el) => el.remove());
        if (showMilestones && currentMilestones.length && calibSamples.length >= 2) {
          const sorted = [...calibSamples].sort((a, b) => a.date - b.date);
          const first = sorted[0];
          const last = sorted[sorted.length - 1];
          const daysSpan = (last.date - first.date) / 86400000;
          if (daysSpan > 0) {
            const dayWidth = (last.x - first.x) / daysSpan;
            const svgHeight = parseFloat(mountSvg.getAttribute("height") || "0");
            const SVG_NS = "http://www.w3.org/2000/svg";
            currentMilestones.forEach((m) => {
              if (!m.date) return;
              const md = new Date(m.date + "T00:00:00");
              const diffDays = (md - first.date) / 86400000;
              const x = first.x + diffDays * dayWidth;
              const g = document.createElementNS(SVG_NS, "g");
              g.setAttribute("class", "gantt-milestone-group");
              // Vertical line through full chart height
              const line = document.createElementNS(SVG_NS, "line");
              line.setAttribute("class", "gantt-milestone-line");
              line.setAttribute("x1", x); line.setAttribute("x2", x);
              line.setAttribute("y1", 0); line.setAttribute("y2", svgHeight);
              g.appendChild(line);
              // Label background pill at the top
              const labelText = "🚩 " + m.name;
              const labelWidth = labelText.length * 6.5 + 12;
              const rect = document.createElementNS(SVG_NS, "rect");
              rect.setAttribute("class", "gantt-milestone-label-bg");
              rect.setAttribute("x", x + 4);
              rect.setAttribute("y", 4);
              rect.setAttribute("width", labelWidth);
              rect.setAttribute("height", 18);
              rect.setAttribute("rx", 3);
              g.appendChild(rect);
              // Label text
              const t = document.createElementNS(SVG_NS, "text");
              t.setAttribute("class", "gantt-milestone-label");
              t.setAttribute("x", x + 10);
              t.setAttribute("y", 16);
              t.textContent = labelText;
              g.appendChild(t);
              mountSvg.appendChild(g);
            });
          }
        }
      });
    }
  </script>
</body>
</html>
